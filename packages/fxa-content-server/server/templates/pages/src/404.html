<!doctype html>
<html dir="{{ lang_dir }}" lang="{{ lang }}">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>{{#t}}Mozilla accounts{{/t}}</title>
    <meta name="description" content="" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=2,user-scalable=yes"
    />
    <meta name="referrer" content="origin" />
    <meta name="robots" content="noindex,nofollow" />

    <!-- build:css(.tmp) /styles/tailwind.out.css -->
    <link rel="stylesheet" href="/styles/tailwind.out.css" />
    <!-- endbuild -->
  </head>
  <body data-static-resource-host="{{{staticResourceUrl}}}">
    <header class="w-full px-6 py-4 mobileLandscape:py-6">
      <a
        id="about-mozilla"
        class="block w-[140px] h-10 bg-mozilla bg-no-repeat bg-contain"
        rel="author"
        target="_blank"
        href="https://www.mozilla.org/about/?utm_source=firefox-accounts&amp;utm_medium=Referral"
        aria-label="{{#t}}Mozilla logo{{/t}}"
      ></a>
    </header>
    <div id="stage" class="flex flex-1 w-full items-center justify-center">
      <div id="main-content" class="card">
        <header>
          <h1 id="fxa-404-header" class="text-xl font-header">
            {{#t}}Page not found{{/t}}
          </h1>
        </header>

        <p class="mt-4 text-sm">
          {{#t}}The page you requested is not found. We've been notified and
          will fix any links that may be broken.{{/t}}
        </p>

        <div class="flex mt-6">
          <a href="/" class="cta-primary cta-xl" id="fxa-404-home"
            >{{#t}}Home{{/t}}</a
          >
        </div>
      </div>
    </div>
  </body>
</html>
