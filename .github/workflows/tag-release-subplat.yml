name: Tag Release SubPlat
on:
  workflow_dispatch: {}
permissions: {}
jobs:
  tagrelease:
    permissions:
      contents: write # To create a branch and tags
    runs-on: ubuntu-latest
    steps:
      - name: Show GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
        shell: bash

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch all git tags
        run: git fetch --tags origin

      - name: Compute new version number
        id: version
        run: |
          echo "versionNumber=$(git tag -l 'subplat-v1.*' --sort=version:refname | tail -1 | awk '{print $2 + 1}' FS='.')" >> "$GITHUB_OUTPUT"

      - name: Create release branch
        env:
          versionNumber: ${{ steps.version.outputs.versionNumber }}
        run: git checkout -b "subplat-train-${versionNumber}"

      - name: Initialize mandatory git config
        run: |
          git config user.name "${GITHUB_TRIGGERING_ACTOR}"
          git config user.email "noreply@github.com"

      - name: Commit update to branch
        if: steps.version.outputs.versionNumber != ''
        env:
          versionNumber: ${{ steps.version.outputs.versionNumber }}
        run: |
          git push origin "subplat-train-${versionNumber}"

      - name: Make a new tag
        if: steps.version.outputs.versionNumber != ''
        env:
          versionNumber: ${{ steps.version.outputs.versionNumber }}
        run: |
          git tag -a "subplat-v1.${versionNumber}.0" -m "SubPlat train release ${versionNumber}"
          git push origin "subplat-v1.${versionNumber}.0"
