about:
  description: Nimbus Feature Manifest for Accounts Web testing
channels:
  - developer
  - staging
  - production
features:
  example-feature:
    description: >
      Plumbing probe. Point a recipe at this feature to prove the
      Experimenter to Remote Settings to Cirrus path works, before pointing it
      at a real feature. Not shown in any UI.
    variables:
      enabled:
        description: If the feature is enabled.
        type: Boolean
        default: false
      emoji:
        description: An emoji to show for this treatment.
        type: Option<String>
        default: null
    defaults:
      - channel: developer
        value: { "enabled": true, "emoji": ":)" }
      - channel: staging
        value: { "enabled": false, "emoji": ";)" }
      - channel: production
        value: { "enabled": false, "emoji": "❤️" }
  promo-qr-mobile:
    description: >
      Value proposition A/B test for the QR mobile download promo shown in the
      authentication flow.

      Set every variable on every arm, the control included. An arm left empty
      falls back to the defaults below, which read as "not enrolled": the user
      sees the built-in control copy and telemetry reports no branch, so that
      arm yields no data.

      The copy here is not translated. It renders as written in every locale.
    variables:
      enabled:
        description: If the experiment is enabled. When false the control ships.
        type: Boolean
        default: false
      branch:
        description: >
          The arm label reported to telemetry. It names the arm in analysis and
          selects nothing, so it must match the branch slug in Experimenter.
        type: Option<String>
        default: null
      heading:
        description: >
          The value proposition heading, in English. Three lines at the promo
          width is the practical maximum.
        type: Option<String>
        default: null
      description:
        description: >
          The call to action under the QR code, in English. One line.
        type: Option<String>
        default: null
      qrUrl:
        description: >
          An https URL for this arm's QR image. Each arm needs its own image
          pointing at its own Bitly link, because the scan is what attributes
          the conversion. A URL that is not https is ignored and the control
          QR ships instead.
        type: Option<String>
        default: null
types:
  objects: {}
  enums: {}
